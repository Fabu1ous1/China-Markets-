<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Рынки Гуанчжоу</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #f4f1ec);
    --text: var(--tg-theme-text-color, #1a1a1a);
    --hint: var(--tg-theme-hint-color, #7a7568);
    --link: var(--tg-theme-link-color, #b3251e);
    --button: var(--tg-theme-button-color, #b3251e);
    --button-text: var(--tg-theme-button-text-color, #ffffff);
    --secondary-bg: var(--tg-theme-secondary-bg-color, #ebe6dc);
    --card-bg: var(--tg-theme-section-bg-color, #ffffff);
    --stamp-red: #b3251e;
    --ink: #1a1a1a;
    --paper: #f4f1ec;
    --line: rgba(26,26,26,0.12);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, sans-serif;
    padding-bottom: 32px;
    min-height: 100vh;
  }

  header {
    padding: 20px 16px 14px;
    border-bottom: 2px solid var(--ink);
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 10;
  }

  .eyebrow {
    font-size: 12px;
    letter-spacing: 0.02em;
    color: var(--hint);
    margin-bottom: 2px;
  }

  h1 {
    font-family: 'Archivo Black', sans-serif;
    font-size: 26px;
    line-height: 1.05;
    margin: 0 0 14px;
    letter-spacing: -0.01em;
  }

  .search-wrap {
    position: relative;
  }

  #search {
    width: 100%;
    padding: 12px 14px;
    font-size: 16px;
    font-family: inherit;
    border: 2px solid var(--ink);
    border-radius: 4px;
    background: var(--card-bg);
    color: var(--text);
  }

  #search:focus { outline: none; border-color: var(--stamp-red); }

  #clear-search {
    display: none;
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    font-size: 20px;
    color: var(--hint);
    cursor: pointer;
    padding: 4px 6px;
  }

  /* Переключатель разделов: Рынки / Фразы */
  .tabs {
    display: flex;
    gap: 0;
    margin-top: 4px;
  }
  .tab-btn {
    flex: 1;
    padding: 10px 0;
    text-align: center;
    font-size: 14px;
    font-weight: 700;
    background: none;
    border: none;
    color: var(--hint);
    border-bottom: 3px solid transparent;
    cursor: pointer;
    font-family: inherit;
  }
  .tab-btn.active {
    color: var(--text);
    border-bottom-color: var(--stamp-red);
  }

  .cat-scroll {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 14px 16px 4px;
    -ms-overflow-style: none;
    scrollbar-width: none;
  }
  .cat-scroll::-webkit-scrollbar { display: none; }

  .chip {
    flex: 0 0 auto;
    padding: 7px 13px;
    border: 1.5px solid var(--ink);
    border-radius: 100px;
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    cursor: pointer;
    background: var(--card-bg);
    color: var(--text);
  }

  .chip.active {
    background: var(--stamp-red);
    border-color: var(--stamp-red);
    color: #fff;
  }

  main { padding: 8px 16px 0; }

  .result-count {
    font-size: 13px;
    color: var(--hint);
    padding: 10px 2px 2px;
  }

  .card {
    background: var(--card-bg);
    border: 1.5px solid var(--line);
    border-left: 4px solid var(--stamp-red);
    border-radius: 6px;
    padding: 14px 16px;
    margin: 10px 0;
    cursor: pointer;
  }

  .card:active { background: var(--secondary-bg); }

  .card-name {
    font-weight: 700;
    font-size: 16px;
    margin: 0 0 3px;
  }

  .card-name-cn {
    font-size: 13px;
    color: var(--hint);
    margin-bottom: 6px;
  }

  .card-products {
    font-size: 14px;
    line-height: 1.4;
    margin: 0;
  }

  .card-cat-tag {
    display: inline-block;
    margin-top: 8px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.03em;
    color: var(--stamp-red);
  }

  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--hint);
  }
  .empty-emoji { font-size: 40px; margin-bottom: 10px; }

  /* Карточки фраз */
  .phrase-card {
    background: var(--card-bg);
    border: 1.5px solid var(--line);
    border-left: 4px solid var(--stamp-red);
    border-radius: 6px;
    padding: 14px 16px;
    margin: 10px 0;
    cursor: pointer;
  }
  .phrase-card:active { background: var(--secondary-bg); }
  .phrase-ru {
    font-size: 15px;
    font-weight: 600;
    margin: 0 0 4px;
  }
  .phrase-cn-preview {
    font-size: 14px;
    color: var(--hint);
  }

  /* Полноэкранный показ фразы продавцу */
  #showcase {
    display: none;
    position: fixed;
    inset: 0;
    background: #fff;
    z-index: 200;
    flex-direction: column;
  }
  #showcase.open { display: flex; }

  .showcase-top {
    padding: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .showcase-close {
    background: none;
    border: 2px solid var(--ink);
    border-radius: 4px;
    width: 36px;
    height: 36px;
    font-size: 18px;
    cursor: pointer;
  }

  .showcase-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }

  .showcase-cn {
    font-size: 15vw;
    line-height: 1.2;
    font-weight: 700;
    color: var(--ink);
    word-break: break-word;
  }

  .showcase-pinyin {
    font-size: 18px;
    color: var(--hint);
    margin-top: 20px;
  }

  .showcase-ru {
    font-size: 15px;
    color: var(--hint);
    margin-top: 28px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    width: 100%;
    max-width: 320px;
  }

  /* Детальный экран */
  #detail {
    display: none;
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: 100;
    overflow-y: auto;
  }
  #detail.open { display: block; }

  .detail-header {
    padding: 18px 16px;
    border-bottom: 2px solid var(--ink);
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .back-btn {
    background: none;
    border: 2px solid var(--ink);
    border-radius: 4px;
    width: 36px;
    height: 36px;
    font-size: 18px;
    cursor: pointer;
    color: var(--text);
    flex-shrink: 0;
  }

  .detail-cat {
    font-size: 12px;
    font-weight: 700;
    color: var(--stamp-red);
    letter-spacing: 0.02em;
  }

  .detail-body { padding: 20px 16px; }

  .detail-name {
    font-family: 'Archivo Black', sans-serif;
    font-size: 24px;
    margin: 0 0 4px;
    line-height: 1.1;
  }

  .detail-cn {
    font-size: 16px;
    color: var(--hint);
    margin-bottom: 20px;
  }

  .field {
    border-top: 1px solid var(--line);
    padding: 14px 0;
  }
  .field-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--hint);
    margin-bottom: 4px;
  }
  .field-value {
    font-size: 15px;
    line-height: 1.5;
  }
  .field-value.mono {
    font-size: 13px;
    color: var(--hint);
  }

  .copy-btn {
    margin-top: 20px;
    width: 100%;
    padding: 14px;
    background: var(--button);
    color: var(--button-text);
    border: none;
    border-radius: 6px;
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
  }
  .copy-btn.copied { background: #4a7c3c; }
</style>
</head>
<body>

<header>
  <div class="eyebrow">128 рынков · Гуанчжоу</div>
  <h1>Куда ехать за товаром</h1>
  <div class="tabs">
    <button class="tab-btn active" id="tab-markets">🏬 Рынки</button>
    <button class="tab-btn" id="tab-phrases">💬 Фразы для переговоров</button>
  </div>
  <div class="search-wrap" style="margin-top:12px;">
    <input id="search" type="text" placeholder="Что ищешь? Например: кожаные сумки" autocomplete="off">
    <button id="clear-search">✕</button>
  </div>
</header>

<div class="cat-scroll" id="cat-scroll"></div>

<main>
  <div class="result-count" id="result-count"></div>
  <div id="list"></div>
</main>

<div id="detail">
  <div class="detail-header">
    <button class="back-btn" id="back-btn">←</button>
    <div class="detail-cat" id="detail-cat"></div>
  </div>
  <div class="detail-body">
    <h2 class="detail-name" id="detail-name"></h2>
    <div class="detail-cn" id="detail-cn"></div>

    <div class="field">
      <div class="field-label">ТОВАРЫ</div>
      <div class="field-value" id="detail-products"></div>
    </div>

    <div class="field" id="detail-address-wrap">
      <div class="field-label">АДРЕС</div>
      <div class="field-value" id="detail-address"></div>
      <div class="field-value mono" id="detail-address-translit"></div>
    </div>

    <button class="copy-btn" id="copy-btn">📋 Скопировать адрес</button>
  </div>
</div>

<!-- Полноэкранный показ фразы — чтобы продавец прочитал сам с телефона -->
<div id="showcase">
  <div class="showcase-top">
    <button class="showcase-close" id="showcase-close">✕</button>
  </div>
  <div class="showcase-body">
    <div class="showcase-cn" id="showcase-cn"></div>
    <div class="showcase-pinyin" id="showcase-pinyin"></div>
    <div class="showcase-ru" id="showcase-ru"></div>
  </div>
</div>

<script>
  const tg = window.Telegram?.WebApp;
  if (tg) { tg.ready(); tg.expand(); }

  let MARKETS = [];
  let PHRASES = [];
  let mode = 'markets';           // 'markets' | 'phrases'
  let activeCategory = 'Все';

  Promise.all([
    fetch('data/markets.json').then(r => r.json()).catch(() => []),
    fetch('data/phrases.json').then(r => r.json()).catch(() => [])
  ]).then(([markets, phrases]) => {
    MARKETS = markets;
    PHRASES = phrases;
    renderCategories();
    applyFilters();
  });

  function currentDataset() {
    return mode === 'markets' ? MARKETS : PHRASES;
  }

  function switchMode(newMode) {
    mode = newMode;
    activeCategory = 'Все';
    document.getElementById('tab-markets').classList.toggle('active', mode === 'markets');
    document.getElementById('tab-phrases').classList.toggle('active', mode === 'phrases');
    document.getElementById('search').placeholder = mode === 'markets'
      ? 'Что ищешь? Например: кожаные сумки'
      : 'Например: скидка, доставка, образец';
    document.getElementById('search').value = '';
    document.getElementById('clear-search').style.display = 'none';
    renderCategories();
    applyFilters();
  }

  document.getElementById('tab-markets').addEventListener('click', () => switchMode('markets'));
  document.getElementById('tab-phrases').addEventListener('click', () => switchMode('phrases'));

  function renderCategories() {
    const data = currentDataset();
    const cats = ['Все', ...new Set(data.map(x => x.category))];
    const wrap = document.getElementById('cat-scroll');
    wrap.innerHTML = cats.map(c =>
      `<button class="chip ${c === activeCategory ? 'active' : ''}" data-cat="${escapeAttr(c)}">${c}</button>`
    ).join('');
    wrap.querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', () => {
        activeCategory = chip.dataset.cat;
        wrap.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        applyFilters();
      });
    });
  }

  function haystackFor(item) {
    if (mode === 'markets') {
      return `${item.name} ${item.products} ${item.category} ${item.name_cn || ''}`.toLowerCase();
    }
    return `${item.ru} ${item.cn} ${item.pinyin} ${item.category}`.toLowerCase();
  }

  function stem(word) {
    // грубый стемминг: отбрасываем окончание, чтобы "скидка"/"скидку" совпадали
    if (word.length > 5) return word.slice(0, -2);
    if (word.length > 3) return word.slice(0, -1);
    return word;
  }

  function applyFilters() {
    const q = document.getElementById('search').value.trim().toLowerCase();
    let results = currentDataset();

    if (activeCategory !== 'Все') {
      results = results.filter(x => x.category === activeCategory);
    }

    if (q) {
      const words = q.split(/\s+/).filter(w => w.length > 1).map(stem);
      results = results
        .map(item => {
          const hay = haystackFor(item);
          const score = words.reduce((s, w) => s + (hay.includes(w) ? 1 : 0), 0);
          return { item, score };
        })
        .filter(x => x.score > 0)
        .sort((a, b) => b.score - a.score)
        .map(x => x.item);
    }

    renderList(results);
  }

  function renderList(items) {
    const countEl = document.getElementById('result-count');
    const listEl = document.getElementById('list');

    countEl.textContent = items.length ? `Найдено: ${items.length}` : '';

    if (!items.length) {
      const emptyText = mode === 'markets'
        ? 'Ничего не нашлось.<br>Попробуй другое слово или категорию.'
        : 'Такой фразы пока нет.<br>Попробуй другое слово.';
      listEl.innerHTML = `<div class="empty"><div class="empty-emoji">🤷</div>${emptyText}</div>`;
      return;
    }

    if (mode === 'markets') {
      listEl.innerHTML = items.map(m => `
        <div class="card" data-id="${m.id}">
          <p class="card-name">${escapeHtml(m.name)}</p>
          ${m.name_cn ? `<p class="card-name-cn">${escapeHtml(m.name_cn)}${m.pinyin ? ' · ' + escapeHtml(m.pinyin) : ''}</p>` : ''}
          <p class="card-products">${escapeHtml(m.products || '')}</p>
          <span class="card-cat-tag">${escapeHtml(m.category)}</span>
        </div>
      `).join('');
      listEl.querySelectorAll('.card').forEach(card => {
        card.addEventListener('click', () => openDetail(parseInt(card.dataset.id)));
      });
    } else {
      listEl.innerHTML = items.map(p => `
        <div class="phrase-card" data-id="${p.id}">
          <p class="phrase-ru">${escapeHtml(p.ru)}</p>
          <p class="phrase-cn-preview">${escapeHtml(p.cn)} · ${escapeHtml(p.pinyin)}</p>
          <span class="card-cat-tag">${escapeHtml(p.category)}</span>
        </div>
      `).join('');
      listEl.querySelectorAll('.phrase-card').forEach(card => {
        card.addEventListener('click', () => openShowcase(parseInt(card.dataset.id)));
      });
    }
  }

  function openDetail(id) {
    const m = MARKETS.find(x => x.id === id);
    if (!m) return;

    document.getElementById('detail-cat').textContent = m.category;
    document.getElementById('detail-name').textContent = m.name;
    document.getElementById('detail-cn').textContent = m.name_cn
      ? `${m.name_cn}${m.pinyin ? ' · ' + m.pinyin : ''}` : '';
    document.getElementById('detail-products').textContent = m.products || '—';

    const addrWrap = document.getElementById('detail-address-wrap');
    if (m.address) {
      addrWrap.style.display = '';
      document.getElementById('detail-address').textContent = m.address;
      document.getElementById('detail-address-translit').textContent = m.address_translit || '';
    } else {
      addrWrap.style.display = 'none';
    }

    const copyBtn = document.getElementById('copy-btn');
    copyBtn.textContent = '📋 Скопировать адрес';
    copyBtn.classList.remove('copied');
    copyBtn.onclick = () => {
      const text = `${m.name} (${m.name_cn || ''})\n${m.address || ''}`;
      navigator.clipboard.writeText(text).then(() => {
        copyBtn.textContent = '✓ Скопировано';
        copyBtn.classList.add('copied');
        if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
      });
    };

    document.getElementById('detail').classList.add('open');
    if (tg) {
      tg.BackButton.show();
      tg.BackButton.onClick(closeDetail);
    }
  }

  function closeDetail() {
    document.getElementById('detail').classList.remove('open');
    if (tg) tg.BackButton.hide();
  }

  document.getElementById('back-btn').addEventListener('click', closeDetail);

  // ---------- Полноэкранный показ фразы продавцу ----------

  function openShowcase(id) {
    const p = PHRASES.find(x => x.id === id);
    if (!p) return;

    document.getElementById('showcase-cn').textContent = p.cn;
    document.getElementById('showcase-pinyin').textContent = p.pinyin;
    document.getElementById('showcase-ru').textContent = p.ru;

    document.getElementById('showcase').classList.add('open');
    if (tg) {
      tg.BackButton.show();
      tg.BackButton.onClick(closeShowcase);
      tg.HapticFeedback?.impactOccurred('light');
    }
  }

  function closeShowcase() {
    document.getElementById('showcase').classList.remove('open');
    if (tg) tg.BackButton.hide();
  }

  document.getElementById('showcase-close').addEventListener('click', closeShowcase);

  const searchInput = document.getElementById('search');
  const clearBtn = document.getElementById('clear-search');
  searchInput.addEventListener('input', () => {
    clearBtn.style.display = searchInput.value ? 'block' : 'none';
    applyFilters();
  });
  clearBtn.addEventListener('click', () => {
    searchInput.value = '';
    clearBtn.style.display = 'none';
    applyFilters();
  });

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function escapeAttr(s) { return escapeHtml(s); }
</script>
</body>
</html>
